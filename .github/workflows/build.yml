name: Build Sentinel Forensic Apps

on:
  push:
    branches:
      - flutter-version
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  # Job 1: Build Android APK
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK (Release)
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-forensic-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # Job 2: Build Windows Executable
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Enable Windows Desktop Build
        run: flutter config --enable-windows-desktop

      - name: Build Windows App (Release)
        run: flutter build windows --release

      - name: Compress Windows Build
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\sentinel-forensic-windows.zip

      - name: Upload Windows Zip
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-forensic-windows-app
          path: build\sentinel-forensic-windows.zip
